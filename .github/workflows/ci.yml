name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Ensure Chrome for Kaleido
        run: python -c "import plotly.io as pio; pio.get_chrome()"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (default, no SAV extras)
        run: pytest -q -m "not sav"

  sav-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies with SAV extra
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,sav]
      - name: Ensure Chrome for Kaleido
        run: python -c "import plotly.io as pio; pio.get_chrome()"
      - name: Run SAV-marked tests
        run: pytest -q -m "sav"
